# S2 PILOT -- near-duplicate removal + the mandatory ARI trap-check.
# Runs on Kaggle (LaBSE needs a GPU to be quick; CPU works but is slow).
#
# THIS CONFIG DOES NOT FREEZE THE SPLIT. It produces no split map. The split is
# frozen in a later step, only after the trap-check outcome is on record.
name: s2_pilot
seed: 42

input_csv: data/cleaned/bn_clean.csv
text_col: "Movie Review"
label_col: "Sentiment"
id_col: "review_id"

# Row count carried over from S1. Asserted on load so a silently regenerated
# bn_clean.csv cannot slip through.
expected_input_n: 4730

embedding:
  model: sentence-transformers/LaBSE
  batch_size: 64
  normalize: true          # L2-normalize -> cosine == dot product
  max_seq_length: 64       # S0: median 8 words, max 84; 64 tokens is ample
  cache_npy: data/cleaned/labse_emb_bn_clean.npy

near_duplicate:
  # The pipeline's operative threshold. Reported alongside the sweep below so
  # the choice is visible as a sensitivity curve, not a single guess.
  primary_threshold: 0.95
  sweep_thresholds: [0.90, 0.95, 0.98]
  keep: first_by_review_id  # deterministic: lowest review_id survives

clustering:
  algorithm: kmeans
  k: 3
  n_init: 10
  random_state: 42
  # Rule 9: UMAP is visualization-only. Clustering happens in LaBSE space.
  cluster_in_umap_space: false

# Pre-committed trap-check bands. These mirror, one-to-one, the four bands in
# docs/protocol.md "RQ1 pre-commitment: interpretation of ARI(cluster,
# Sentiment)", pre-registered 2026-07-28 BEFORE any ARI value existed.
# Do not edit after a result. If these and protocol.md ever disagree, the
# protocol wins and the run is invalid.
trap_check:
  metric: ARI(cluster_labels, Sentiment)

  # Band 0 gate. A cluster holding less than min or more than max of n means
  # K-Means did not partition; ARI is then uninterpretable and is overridden.
  degenerate_cluster_share: {min: 0.05, max: 0.70}

  bands:
    # Band 0 -- degeneracy, evaluated FIRST and overriding ARI entirely.
    no_claim: degenerate
    # Band 1 -- clusters not aligned with the sentiment axis.
    not_sentiment_aligned_below: 0.20
    # Band 2 -- partial overlap; the residual test is MANDATORY, not optional.
    partial_overlap_range: [0.20, 0.60]
    # Band 3 -- the persona claim fails as stated.
    persona_claim_fails_above: 0.60

# Added 2026-07-30 after S2c found the corpus is two corpora joined at raw row
# 1999 (see results/s2c_region_split.md). `review_id` is `bn_<raw row>`, so
# region is recoverable from the id with no extra data.
#
# This does NOT change what is clustered or how -- it adds a second thing the
# same clustering is scored against. If ARI(cluster, region) exceeds
# ARI(cluster, Sentiment), the encoder is recovering which file a review came
# from, and no persona reading survives.
region:
  boundary_row: 1999
  score_against_region: true
  restrict_to: null          # null = whole corpus; "A_organic" for the subset

outputs:
  near_dup_pairs_csv: data/cleaned/near_dup_pairs.csv
  report_md: results/s2_pilot_ari_trapcheck.md
  # Persisted from this run onward. The first run did not save them, so every
  # follow-up question had to be reconstructed from the printed crosstab.
  cluster_assignments_csv: results/s2_cluster_assignments.csv
