# S3.3b -- Verifier-B, the S6 evaluator. NEVER enters the loop.
# Pre-registered in docs/protocol.md section "S3.3 pre-commitment", written
# 2026-08-11 before this artifact existed.

step: S3.3b

# 🔴 The single most important line in this file. `role: B` draws R2.
#
# configs/s3_backbone.yaml sets `role: A`, so EVERY S3.2 arm was trained on R1 --
# Verifier-A's data. Decision 16 said Verifier-B is "the fine-tuned BanglaBERT
# from S3.2", which read literally would have put A and B on the same rows and
# voided inviolable rule 6, taking RQ5 with it. The binding definition, fixed on
# 2026-08-11: Verifier-B is the BanglaBERT *recipe* -- same backbone, same
# budget, same seeds -- RETRAINED here on R2. **No S3.2 checkpoint is ever
# loaded as Verifier-B**, and tests/test_s3_verifiers.py fails if this says "A".
role: B

inputs:
  split_map: data/splits/split_map_v1.json
  k2_assignments: results/s2e_regionA_k2_assignments.csv
  cleaned_csv: data/cleaned/bn_clean.csv

expected:
  train_n: 888
  train_class_counts: {0: 531, 1: 357}
  dev_n: 82
  dev_class_counts: {0: 53, 1: 29}

model:
  key: banglabert
  model: csebuetnlp/banglabert
  kind: finetune
  # Same string as the winning S3.2 arm. It won by the pre-registered TIE-break
  # (smallest params), not on performance -- and after S3.2b the ablation may
  # support no claim about backbones at all. What it DOES support, and the only
  # thing claimed here: BanglaBERT is a viable independent evaluator, from a
  # different pretraining family than Verifier-A's LaBSE.

training:
  # Identical to configs/s3_backbone.yaml except for `learning_rates`.
  seeds: [42, 43, 44, 45, 46]
  # 🔴 ONE learning rate, not two. The pipeline §3.1 default, taken from the
  # spec and never selected against a score. schneider2025overtuning find ~10%
  # of HPO runs pick a config that generalises WORSE than the default, and their
  # aggravating conditions -- small data, holdout not CV, binary task,
  # accuracy-type metric -- describe all four of this run's properties.
  # Sabbir's call, 2026-08-11. See protocol.md S3.3 decision 1.
  learning_rates: [2.0e-5]
  epochs: 4
  batch_size: 16
  max_length: 128

artifact_selection:
  # Five seeds produce five models; exactly one is persisted as Verifier-B.
  #
  # `global_seed` means: the seed-42 model, declared here before any score
  # exists. NOT the best of five -- that would be selection on the reporting
  # slice, the very thing decision 1 refuses. The other four seeds are reported
  # as the sensitivity band and are never candidates.
  #
  # An ensemble of all five was considered and rejected: Verifier-A is a single
  # model, and an ensembled B would make the RQ5 A-B gap partly a gap between
  # "one model" and "five", which no later analysis could separate out.
  # Symmetry with A is worth more here than the ensemble's calibration gain.
  rule: global_seed
  seed: 42

calibration:
  enabled: true
  n_bins: 5
  n_resamples: 10000
  descriptive: true

outputs:
  results_json: results/s3d_verifier_b.json
  results_md: results/s3d_verifier_b.md
  per_seed_csv: results/s3d_verifier_b_per_seed.csv
  dev_predictions_csv: results/s3d_verifier_b_dev_predictions.csv
  artifact: artifacts/verifier_b.joblib
  env_snapshot: results/env_snapshot_s3d_kaggle.json
