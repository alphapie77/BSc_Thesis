# S5 Bangla analysis, to be run only after score_s5_bn.py has sealed its manifest.
step: S5.analysis.bn
seed: 42
replicate_seeds: [42, 43, 44]

inputs:
  b_scores_jsonl: results/s5_main_bn_verifier_b_scores.jsonl
  cases_jsonl: results/s5_main_bn_cases.jsonl

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  correction: benjamini_hochberg
  binary_success_threshold: 0.5
  baseline_condition: zero_shot

outputs:
  master_table_csv: results/s5_main_bn_master_table.csv
  paired_statistics_csv: results/s5_main_bn_paired_statistics.csv
  goodhart_by_attempt_csv: results/s5_main_bn_goodhart_by_attempt.csv
  analysis_json: results/s5_main_bn_analysis.json
