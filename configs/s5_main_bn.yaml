# S5 main Bangla experiment. Frozen before any eval-plot generation.
step: S5.main.bn
seed: 42
replicate_seeds: [42, 43, 44]

runtime:
  scikit_learn: 1.9.0  # symbolic artifact runtime, frozen by S4.5a repair
  transformers: 5.15.0  # exact nf4 runtime that produced the S4 archive

inputs:
  plots_csv: data/plots/plots_bn.csv
  split_map: data/splits/split_map_v1.json
  k2_assignments: results/s2e_regionA_k2_assignments.csv
  cleaned_csv: data/cleaned/bn_clean.csv
  s4_scores_csv: results/s4_w_scores.csv
  verifier_a: artifacts/verifier_a.joblib
  symbolic_scorer: artifacts/symbolic_scorer.joblib
  rag_manifest: results/s4_index_manifest.json

rag:
  persist_dir: data/rag/r1_index
  collection: r1_regionA_k2
  encoder: sentence-transformers/LaBSE
  top_k: 10  # pipeline §4.2; held fixed for every RAG condition

sample:
  split: eval
  n_plots: 90  # frozen eval surface; pipeline §5.1 and plots split manifest
  levels: [0, 1]
  prompt_arm: bn
  length_controlled: true

writer:
  model: google/gemma-3-12b-it
  provider: local
  # Audit 2026-08-20: both S4 runners called generate(), which wraps a one-item
  # generate_batch(). The old value 8 was nominal metadata, not realized batch.
  batch_size: 1  # preserve the actual S4 path used to fit tau
  quantization: nf4
  max_new_tokens: 80
  temperature: 0.8
  top_p: 0.9

conditions:
  - zero_shot
  - static_few_shot
  - rag_only
  - rag_neural_loop
  - rag_symbolic_loop
  - rag_neural_symbolic_feedback
  - intrinsic_self_critique
  - external_role_self_critique
  - gemma4_26b_a4b_judge_loop
  - blind_resampling

static_few_shot:
  source_role: A
  partition: R1
  selection_seed: 42
  per_level: 10  # protocol §S5 runner contract 1, frozen before generation
  selection_mode: instance_level_random
  selection_key: [replicate_seed, plot_id, target_level]
  query_dependent: false

neural_gate:
  tau: 0.4384071  # selected by results/s4_tau_frontier.json
  max_attempts: 3  # frozen S4 loop contract; diminishing returns measured in S4.6

symbolic_gate:
  target_first_pass_rate: 0.65  # matches S4 neural first-pass 39/60
  expected_tau: 0.18166513482099075
  expected_passes: 39
  expected_cases: 60
  max_attempts: 3  # identical retry budget to neural loop, protocol §S5

gemini_judge:
  model: gemma-4-26b-a4b-it
  transport: interactions_v1beta
  seed: 42  # global reproducibility contract; supported by Interactions API
  thinking_level: high  # Gemma 4 supports only minimal/high; freeze judge reasoning on
  max_output_tokens: 512  # bounded structured verdict + hidden reasoning budget
  structured_output: true
  max_attempts: 3  # identical retry budget to proposed loop, protocol §S5
  feedback_language: bn
  feedback_max_sentences: 2  # bounded diagnostic payload, protocol §S5 contract 3
  all_fail_selection: highest_target_fit_score_then_earliest
  # Effective free-project limits read from AI Studio on 2026-08-21:
  # 30 RPM, 16K TPM, 14.4K RPD. We stay below all three and reserve headroom
  # for preflight plus unrelated project traffic.
  requests_per_minute: 30
  tokens_per_minute: 16000
  requests_per_pacific_day: 14400
  safety_fraction: 0.90

blind_resampling:
  max_candidates: 5  # full nested frontier frozen in protocol decision 9
  selection: verifier_a
  primary_budget: matched_realized_generator_flops_to_row6
  report_prefixes: [1, 2, 3, 4, 5]

outputs:
  calls_jsonl: data/generated/s5_main_bn_calls.jsonl
  gemini_calls_jsonl: data/generated/s5_main_bn_gemini_calls.jsonl
  superseded_gemini36_calls_jsonl: data/generated/s5_main_bn_gemini36_superseded_calls.jsonl
  superseded_gemini36_writer_calls_jsonl: data/generated/s5_main_bn_gemini36_superseded_writer_calls.jsonl
  superseded_gemini36_cases_jsonl: results/s5_main_bn_gemini36_superseded_cases.jsonl
  cases_jsonl: results/s5_main_bn_cases.jsonl
  preflight_json: results/s5_main_bn_preflight.json
