<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" role="img" aria-labelledby="title desc">
  <title id="title">Macro-level research methodology</title>
  <desc id="desc">Six-phase workflow from corpus preparation to independent evaluation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#26364a"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#16823b"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c62828"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#102033}.phase{font:700 25px Arial,sans-serif;fill:#102033}.nodeTitle{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 19px Arial,sans-serif;fill:#24364b}.small{font:400 16px Arial,sans-serif;fill:#43546a}.tag{font:700 16px Arial,sans-serif}.panel{stroke-width:3.5;filter:url(#shadow)}.node{stroke-width:3}.flow{fill:none;stroke:#26364a;stroke-width:4;marker-end:url(#arrow)}.pass{fill:none;stroke:#16823b;stroke-width:4.5;marker-end:url(#greenArrow)}.retry{fill:none;stroke:#c62828;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="2000" height="1320" fill="#fff"/><text x="1000" y="54" text-anchor="middle" class="title">Macro-Level Research Methodology</text>

  <rect x="70" y="95" width="520" height="230" rx="18" fill="#eaf3ff" stroke="#2370c8" class="panel"/>
  <text x="330" y="140" text-anchor="middle" class="phase">PHASE 1: DATA PREPARATION</text>
  <text x="105" y="187" class="body">5,000 raw Bangla cinema reviews</text><text x="105" y="226" class="body">Cleaning and duplicate control</text><text x="105" y="265" class="body">4,625 unique cleaned reviews</text><text x="105" y="302" class="small">Frozen: Gold 300  ·  R1 2,162  ·  R2 2,163</text>

  <rect x="740" y="95" width="520" height="230" rx="18" fill="#fff3df" stroke="#e56513" class="panel"/>
  <text x="1000" y="140" text-anchor="middle" class="phase">PHASE 2: CONSTRUCT VALIDATION</text>
  <text x="775" y="187" class="body">LaBSE-based diagnostic analysis</text><text x="775" y="226" class="body">Confound and stability checks</text><text x="775" y="265" class="body">Human comparative judgement</text><text x="775" y="302" class="small">Two engagement-specificity levels retained</text>

  <rect x="1410" y="95" width="520" height="230" rx="18" fill="#f0ecff" stroke="#7948d6" class="panel"/>
  <text x="1670" y="140" text-anchor="middle" class="phase">PHASE 3: VERIFIER DEVELOPMENT</text>
  <text x="1445" y="187" class="body">Validated level-labelled reviews</text><text x="1445" y="226" class="body">Verifier-A: generation-time gate</text><text x="1445" y="265" class="body">Verifier-B: independent evaluator</text><text x="1445" y="302" class="small">Lightweight models; no LLM fine-tuning</text>
  <path d="M590 210 H720" class="flow"/><path d="M1260 210 H1390" class="flow"/>

  <rect x="70" y="390" width="1860" height="525" rx="26" fill="#f1faf4" stroke="#248044" class="panel"/>
  <text x="1000" y="438" text-anchor="middle" class="phase">PHASE 4: BOUNDED NEURO-SYMBOLIC RESPONSE GENERATION</text>

  <rect x="115" y="535" width="250" height="190" rx="16" fill="#fff" stroke="#66788d" class="node"/><text x="240" y="580" text-anchor="middle" class="nodeTitle">INPUT</text><text x="240" y="628" text-anchor="middle" class="body">Movie plot</text><text x="240" y="667" text-anchor="middle" class="body">Target level</text>
  <rect x="445" y="505" width="310" height="250" rx="16" fill="#e7f2ff" stroke="#2370c8" class="node"/><text x="600" y="550" text-anchor="middle" class="nodeTitle">R1-ONLY RAG</text><text x="600" y="598" text-anchor="middle" class="body">LaBSE retrieval</text><text x="600" y="637" text-anchor="middle" class="body">886-item index</text><text x="600" y="676" text-anchor="middle" class="body">10 exemplars</text><text x="600" y="722" text-anchor="middle" class="small">No Gold or R2 access</text>
  <rect x="835" y="505" width="310" height="250" rx="16" fill="#e9f7ec" stroke="#26964d" class="node"/><text x="990" y="550" text-anchor="middle" class="nodeTitle">WRITER</text><text x="990" y="598" text-anchor="middle" class="body">Prompted LLM</text><text x="990" y="637" text-anchor="middle" class="body">Plot-grounded</text><text x="990" y="676" text-anchor="middle" class="body">Bangla response</text>
  <rect x="1225" y="505" width="320" height="250" rx="16" fill="#fff3df" stroke="#e56513" class="node"/><text x="1385" y="550" text-anchor="middle" class="nodeTitle">CRITIC</text><text x="1385" y="598" text-anchor="middle" class="body">Verifier-A gate</text><text x="1385" y="637" text-anchor="middle" class="body">Symbolic diagnostics</text><text x="1385" y="676" text-anchor="middle" class="body">PASS / FAIL</text>
  <rect x="1625" y="535" width="260" height="190" rx="16" fill="#e8f7f5" stroke="#14817c" class="node"/><text x="1755" y="580" text-anchor="middle" class="nodeTitle">OUTPUT</text><text x="1755" y="628" text-anchor="middle" class="body">Final response</text><text x="1755" y="667" text-anchor="middle" class="small">Attempt trace retained</text>
  <path d="M365 630 H425" class="flow"/><path d="M755 630 H815" class="flow"/><path d="M1145 630 H1205" class="flow"/><path d="M1545 630 H1605" class="pass"/><text x="1575" y="608" text-anchor="middle" class="tag" fill="#16823b">PASS</text>
  <rect x="1110" y="810" width="430" height="72" rx="14" fill="#fff0f1" stroke="#c62828" class="node"/><text x="1325" y="839" text-anchor="middle" class="nodeTitle">REFLECTOR FEEDBACK</text><text x="1325" y="868" text-anchor="middle" class="small">Revise while attempt &lt; 3; otherwise emit best draft</text>
  <path d="M1385 755 V790" class="retry"/><text x="1418" y="786" class="tag" fill="#c62828">FAIL</text><path d="M1110 846 H990 V775" class="retry"/>

  <rect x="130" y="985" width="720" height="245" rx="20" fill="#f0ecff" stroke="#7948d6" class="panel"/><text x="490" y="1030" text-anchor="middle" class="phase">PHASE 5: CONTROLLED EXPERIMENT</text><text x="170" y="1080" class="body">90 evaluation plots × 2 target levels</text><text x="170" y="1121" class="body">10 registered generation conditions</text><text x="170" y="1162" class="body">Three paired sampling replicates</text><text x="170" y="1202" class="small">Zero-shot, prompting, RAG, loops, and matched controls</text>
  <rect x="1150" y="985" width="720" height="245" rx="20" fill="#e8f7f5" stroke="#14817c" class="panel"/><text x="1510" y="1030" text-anchor="middle" class="phase">PHASE 6: INDEPENDENT EVALUATION</text><text x="1190" y="1080" class="body">Sealed Verifier-B outcome scoring</text><text x="1190" y="1121" class="body">Blinded human evaluation</text><text x="1190" y="1162" class="body">Paired statistical comparisons</text><text x="1190" y="1202" class="small">Controllability, proxy divergence, diversity, and cost</text>
  <path d="M1755 725 V945 H490 V965" class="flow"/><path d="M850 1108 H1130" class="flow"/>
  <path d="M1670 325 V365 H1905 V955 H1510 V965" fill="none" stroke="#14817c" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/><rect x="1660" y="347" width="230" height="37" rx="8" fill="#fff"/><text x="1775" y="373" text-anchor="middle" class="tag" fill="#147a76">SEALED VERIFIER-B PATH</text>
  <g transform="translate(1000 1278)"><line x1="-460" y1="0" x2="-390" y2="0" stroke="#26364a" stroke-width="4" marker-end="url(#arrow)"/><text x="-370" y="6" class="small">research flow</text><line x1="-120" y1="0" x2="-50" y2="0" stroke="#c62828" stroke-width="4" stroke-dasharray="10 8"/><text x="-30" y="6" class="small">bounded revision</text><line x1="230" y1="0" x2="300" y2="0" stroke="#14817c" stroke-width="4" stroke-dasharray="10 8"/><text x="320" y="6" class="small">independent evaluation</text></g>
</svg>
