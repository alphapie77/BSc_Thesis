<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1460" viewBox="0 0 2000 1460" role="img" aria-labelledby="title desc">
  <title id="title">Micro-level verifier-in-the-loop generation workflow</title>
  <desc id="desc">Detailed workflow of the Researcher, Writer, Critic, and Reflector agents, with R1-only retrieval, bounded retries, final output selection, and sealed Verifier-B evaluation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#26364a"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#16823b"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c62828"/></marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#147a76"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#102033}.subtitle{font:400 18px Arial,sans-serif;fill:#526276}.head{font:700 23px Arial,sans-serif;fill:#102033}.body{font:400 18px Arial,sans-serif;fill:#24364b}.small{font:400 16px Arial,sans-serif;fill:#43546a}.tag{font:700 16px Arial,sans-serif}.panel{stroke-width:3.5;filter:url(#shadow)}.node{stroke-width:3}.flow{fill:none;stroke:#26364a;stroke-width:4;marker-end:url(#arrow)}.tool{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}.pass{fill:none;stroke:#16823b;stroke-width:4.5;marker-end:url(#greenArrow)}.retry{fill:none;stroke:#c62828;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#redArrow)}.sealed{fill:none;stroke:#147a76;stroke-width:4;stroke-dasharray:12 9;marker-end:url(#tealArrow)}
    </style>
  </defs>
  <rect width="2000" height="1460" fill="#fff"/>
  <text x="1000" y="54" text-anchor="middle" class="title">Micro-Level Verifier-in-the-Loop Generation Workflow</text>
  <text x="1000" y="86" text-anchor="middle" class="subtitle">One plot × target-level case; Verifier-B remains outside the generation loop</text>

  <!-- Input and state -->
  <rect x="70" y="150" width="330" height="220" rx="20" fill="#fff" stroke="#66788d" class="panel"/>
  <text x="235" y="198" text-anchor="middle" class="head">CASE INPUT</text>
  <text x="105" y="247" class="body">• Bangla movie plot</text>
  <text x="105" y="287" class="body">• Target level: 0 or 1</text>
  <text x="105" y="327" class="body">• Replicate seed</text>

  <rect x="500" y="135" width="390" height="250" rx="20" fill="#f5f7fa" stroke="#66788d" class="panel"/>
  <text x="695" y="183" text-anchor="middle" class="head">INITIALIZE SHARED STATE</text>
  <text x="535" y="230" class="body">plot, target_level</text>
  <text x="535" y="269" class="body">attempt = 1</text>
  <text x="535" y="308" class="body">feedback = none</text>
  <text x="535" y="347" class="body">trace = empty</text>

  <path d="M400 260 H480" class="flow"/>

  <!-- Researcher and retrieval tool -->
  <rect x="1020" y="135" width="400" height="250" rx="20" fill="#e7f2ff" stroke="#2370c8" class="panel"/>
  <text x="1220" y="183" text-anchor="middle" class="head">AGENT 1: RESEARCHER</text>
  <text x="1055" y="230" class="body">Build anchored query from:</text>
  <text x="1080" y="269" class="body">plot + target level</text>
  <text x="1080" y="308" class="body">+ feedback terms on retry</text>
  <text x="1055" y="347" class="small">Original query remains anchored</text>
  <path d="M890 260 H1000" class="flow"/>

  <rect x="1550" y="135" width="380" height="250" rx="20" fill="#f0ecff" stroke="#7948d6" class="panel"/>
  <text x="1740" y="183" text-anchor="middle" class="head">R1 RETRIEVER</text>
  <text x="1585" y="230" class="body">LaBSE similarity search</text>
  <text x="1585" y="269" class="body">886 validated R1 reviews</text>
  <text x="1585" y="308" class="body">Top 10 exemplars</text>
  <text x="1585" y="347" class="small">Gold and R2 are inaccessible</text>
  <path d="M1420 260 H1530" class="tool"/>
  <text x="1475" y="243" text-anchor="middle" class="tag" fill="#526276">QUERY</text>
  <path d="M1550 335 H1475 V365 H1435" class="tool"/>
  <text x="1492" y="357" text-anchor="middle" class="tag" fill="#526276">TOP-10</text>

  <!-- Writer -->
  <rect x="740" y="500" width="520" height="280" rx="22" fill="#e9f7ec" stroke="#26964d" class="panel"/>
  <text x="1000" y="550" text-anchor="middle" class="head">AGENT 2: WRITER</text>
  <text x="785" y="599" class="body">Construct prompt:</text>
  <text x="815" y="638" class="body">level definition + retrieved exemplars</text>
  <text x="815" y="677" class="body">+ movie plot + prior draft/feedback on retry</text>
  <text x="785" y="726" class="body">Generate one Bangla response with prompted LLM</text>
  <text x="785" y="758" class="small">The language model is not fine-tuned</text>
  <path d="M1220 385 V445 H1000 V480" class="flow"/>

  <!-- Critic and scoring components -->
  <rect x="740" y="900" width="520" height="275" rx="22" fill="#fff3df" stroke="#e56513" class="panel"/>
  <text x="1000" y="950" text-anchor="middle" class="head">AGENT 3: CRITIC</text>
  <text x="785" y="999" class="body">Score draft with Verifier-A</text>
  <text x="785" y="1038" class="body">Compute symbolic diagnostic indicators</text>
  <text x="785" y="1077" class="body">Apply frozen acceptance threshold</text>
  <text x="785" y="1126" class="small">Output: PASS/FAIL, gate score, diagnostics</text>
  <path d="M1000 780 V880" class="flow"/>

  <rect x="80" y="865" width="470" height="310" rx="20" fill="#f0ecff" stroke="#7948d6" class="panel"/>
  <text x="315" y="915" text-anchor="middle" class="head">VALIDATION COMPONENTS</text>
  <text x="120" y="968" class="body">Neural gate</text>
  <text x="145" y="1006" class="small">Frozen LaBSE-probe Verifier-A probability</text>
  <text x="120" y="1057" class="body">Symbolic diagnostics</text>
  <text x="145" y="1095" class="small">Interpretable rule-name feedback</text>
  <text x="120" y="1146" class="small">Gate and diagnosis have separate roles</text>
  <path d="M550 1020 H720" class="tool"/>

  <!-- Pass output -->
  <rect x="1480" y="895" width="430" height="285" rx="22" fill="#e8f7f5" stroke="#14817c" class="panel"/>
  <text x="1695" y="945" text-anchor="middle" class="head">FINAL GENERATION OUTPUT</text>
  <text x="1520" y="998" class="body">• Selected Bangla response</text>
  <text x="1520" y="1039" class="body">• Attempt count and give-up flag</text>
  <text x="1520" y="1080" class="body">• Per-attempt evidence trace</text>
  <text x="1520" y="1130" class="small">Accepted draft, or best-of-3 after failure</text>
  <path d="M1260 1015 H1460" class="pass"/>
  <text x="1360" y="992" text-anchor="middle" class="tag" fill="#16823b">PASS OR TERMINATE</text>

  <!-- Reflector loop -->
  <rect x="1350" y="505" width="520" height="275" rx="22" fill="#fff0f1" stroke="#c62828" class="panel"/>
  <text x="1610" y="555" text-anchor="middle" class="head">AGENT 4: REFLECTOR</text>
  <text x="1395" y="605" class="body">If FAIL and attempt &lt; 3:</text>
  <text x="1425" y="644" class="body">convert diagnostics into actionable feedback</text>
  <text x="1425" y="683" class="body">increment attempt and preserve trace</text>
  <text x="1395" y="733" class="small">Then return to anchored retrieval and rewriting</text>
  <path d="M1260 1100 H1320 V800 H1610" class="retry"/>
  <text x="1300" y="1077" class="tag" fill="#c62828">FAIL, ATTEMPT &lt; 3</text>
  <path d="M1610 505 V435 H1220 V405" class="retry"/>
  <text x="1450" y="422" text-anchor="middle" class="tag" fill="#c62828">FEEDBACK + RETRY</text>

  <!-- Sealed evaluator -->
  <rect x="570" y="1280" width="860" height="125" rx="20" fill="#e8f7f5" stroke="#14817c" class="panel"/>
  <text x="1000" y="1325" text-anchor="middle" class="head">SEALED OUTCOME EVALUATION: VERIFIER-B + BLINDED HUMAN STUDY</text>
  <text x="1000" y="1366" text-anchor="middle" class="body">Final outputs only · no feedback to agents · no threshold tuning · Goodhart divergence remains observable</text>
  <path d="M1695 1180 V1245 H1430 V1260" class="sealed"/>
  <text x="1590" y="1230" text-anchor="middle" class="tag" fill="#147a76">EVALUATION ONLY</text>

  <!-- Legend -->
  <g transform="translate(1000 1435)"><line x1="-480" y1="0" x2="-410" y2="0" stroke="#26364a" stroke-width="4" marker-end="url(#arrow)"/><text x="-390" y="6" class="small">generation flow</text><line x1="-120" y1="0" x2="-50" y2="0" stroke="#c62828" stroke-width="4" stroke-dasharray="10 8"/><text x="-30" y="6" class="small">bounded retry</text><line x1="235" y1="0" x2="305" y2="0" stroke="#147a76" stroke-width="4" stroke-dasharray="10 8"/><text x="325" y="6" class="small">sealed evaluation</text></g>
</svg>
