<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="fig5-title fig5-desc">
  <title id="fig5-title">Bounded multi-agent generation workflow</title>
  <desc id="fig5-desc">The Researcher retrieves evidence, the Writer drafts, the Critic decides, and the Reflector forms feedback. Every non-terminal failure retrieves again; symbolic-feedback conditions augment the anchored query with failed feature names. Verifier-B scores only after emission.</desc>
  <defs>
    <marker id="f5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6f8f"/></marker>
    <marker id="f5-arrow-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6427"/></marker>
    <marker id="f5-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#182230}.kicker{font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#2f6f8f}.title{font-size:26px;font-weight:600}.node-title{font-size:18px;font-weight:600}.body{font-size:14px;fill:#344054}.small{font-size:12.5px;fill:#667085}.label{font-size:12px;font-weight:600;letter-spacing:.8px}.agent{fill:#f1f7fa;stroke:#7ba8bd;stroke-width:1.5;rx:12;ry:12}.decision{fill:#fffaf5;stroke:#dc9b6c;stroke-width:1.5}.state{fill:#f8fafc;stroke:#aab4c3;stroke-width:1.4;rx:10;ry:10}.flow{fill:none;stroke:#2f6f8f;stroke-width:2.5;marker-end:url(#f5-arrow)}.retry{fill:none;stroke:#bd6427;stroke-width:2.5;marker-end:url(#f5-arrow-retry)}.outside{fill:none;stroke:#667085;stroke-width:2.2;stroke-dasharray:6 6;marker-end:url(#f5-arrow-gray)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="52" y="38" class="kicker">FIGURE 5.1 · BOUNDED WORKFLOW ROUTING</text>
  <text x="52" y="72" class="title">Bounded neuro-symbolic generation and evaluation workflow</text>
  <text x="52" y="98" class="body">Fixed transitions govern retrieval, generation, evaluation, feedback and termination; Verifier-B remains outside the loop.</text>

  <rect x="42" y="128" width="1108" height="402" rx="16" fill="#fbfcfe" stroke="#d8dee8"/><text x="64" y="157" class="label" fill="#667085">GENERATION GRAPH</text>
  <rect x="66" y="204" width="174" height="104" class="state"/><text x="86" y="235" class="node-title">Task state</text><text x="86" y="261" class="body">plot + target level</text><text x="86" y="284" class="small">attempt = 1</text>
  <rect x="292" y="190" width="190" height="132" class="agent"/><text x="312" y="218" class="label" fill="#2f6f8f">01 · EVIDENCE</text><text x="312" y="249" class="node-title">Researcher</text><text x="312" y="275" class="body">top-10 same-level R1</text><text x="312" y="298" class="small">plot anchor + optional rule terms</text>
  <rect x="534" y="190" width="190" height="132" class="agent"/><text x="554" y="218" class="label" fill="#2f6f8f">02 · DRAFT</text><text x="554" y="249" class="node-title">Writer</text><text x="554" y="275" class="body">Bangla response</text><text x="554" y="298" class="small">plot + definition + evidence</text>
  <rect x="776" y="190" width="190" height="132" class="agent"/><text x="796" y="218" class="label" fill="#2f6f8f">03 · DIAGNOSE</text><text x="796" y="249" class="node-title">Critic</text><text x="796" y="275" class="body">Verifier-A + rules</text><text x="796" y="298" class="small">score · failures · decision</text>
  <path d="M240 256H292" class="flow"/><path d="M482 256H534" class="flow"/><path d="M724 256H776" class="flow"/>
  <path d="M1016 256L1066 206L1116 256L1066 306Z" class="decision"/><text x="1066" y="251" text-anchor="middle" class="node-title">Accept?</text><text x="1066" y="273" text-anchor="middle" class="small">gate ≥ threshold</text><path d="M966 256H1016" class="flow"/>

  <rect x="776" y="386" width="190" height="116" class="agent"/><text x="796" y="414" class="label" fill="#bd6427">04 · REFLECT</text><text x="796" y="445" class="node-title">Reflector</text><text x="796" y="471" class="body">bounded correction brief</text><text x="796" y="494" class="small">neural result + named failures</text>
  <rect x="534" y="386" width="190" height="116" class="state"/><text x="554" y="417" class="node-title">Trace record</text><text x="554" y="444" class="body">draft · scores · evidence</text><text x="554" y="468" class="body">feedback · decision</text><text x="554" y="491" class="small">new record per attempt</text>
  <path d="M1066 306V350Q1066 368 1048 368H889Q871 368 871 386" class="retry"/><text x="924" y="356" class="label" fill="#bd6427">FAIL · ATTEMPT &lt; 3</text>
  <path d="M776 444H724" class="outside"/><text x="735" y="432" class="small">record</text><path d="M629 386V322" class="retry"/><text x="642" y="356" class="small">rewrite</text>
  <path d="M776 474C650 556 387 546 387 322" class="retry"/><rect x="402" y="500" width="305" height="24" rx="6" fill="#fbfcfe"/><text x="418" y="517" class="small">retrieve again; add failed rule names when enabled</text>
  <path d="M1116 256H1140" class="flow"/><text x="1104" y="238" class="label" fill="#2f6f8f">PASS → EMIT</text><text x="952" y="174" class="small">FAIL at attempt 3:</text><text x="952" y="192" class="small">seal highest-gate draft → emit</text>

  <rect x="42" y="552" width="1108" height="86" rx="14" fill="#f8fafc" stroke="#d8dee8"/><text x="64" y="579" class="label" fill="#667085">AFTER EMISSION · OUTSIDE THE GRAPH</text>
  <rect x="314" y="570" width="220" height="50" class="state"/><text x="334" y="601" class="node-title">Sealed response</text><rect x="710" y="570" width="220" height="50" class="state"/><text x="730" y="601" class="node-title">Verifier-B score</text><path d="M534 595H710" class="outside"/><text x="560" y="582" class="small">outcome observation only</text><text x="960" y="590" class="body">No retrieval · no feedback</text><text x="960" y="613" class="body">no selection · no retry</text>
</svg>
