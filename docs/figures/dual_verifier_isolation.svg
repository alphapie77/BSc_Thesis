<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="fig4-title fig4-desc">
  <title id="fig4-title">Dual-verifier isolation architecture</title>
  <desc id="fig4-desc">A four-column architecture showing frozen data partitions, fitted artifacts, the generation system, and outcome evaluation. Verifier-B remains behind a privilege wall and cannot affect generation.</desc>
  <defs>
    <marker id="f4-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6f8f"/></marker>
    <marker id="f4-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6427"/></marker>
    <marker id="f4-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#182230}.kicker{font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#2f6f8f}.title{font-size:26px;font-weight:600}.col{font-size:13px;font-weight:600;letter-spacing:1px;fill:#667085}.node-title{font-size:18px;font-weight:600}.body{font-size:14px;fill:#344054}.small{font-size:12.5px;fill:#667085}.lane-label{font-size:13px;font-weight:600;letter-spacing:.6px}.node{stroke-width:1.4;rx:10;ry:10}.blue-node{fill:#f1f7fa;stroke:#7ba8bd}.orange-node{fill:#fff6ed;stroke:#dc9b6c}.neutral-node{fill:#f8fafc;stroke:#aab4c3}.blue-flow{fill:none;stroke:#2f6f8f;stroke-width:2.4;marker-end:url(#f4-arrow-blue)}.orange-flow{fill:none;stroke:#bd6427;stroke-width:2.4;marker-end:url(#f4-arrow-orange)}.gray-flow{fill:none;stroke:#667085;stroke-width:2.1;marker-end:url(#f4-arrow-gray)}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="52" y="38" class="kicker">FIGURE 4.1 · DATA AND PRIVILEGE ISOLATION</text>
  <text x="52" y="72" class="title">Two verifiers, two data sources, one enforced wall</text>
  <text x="52" y="98" class="body">Verifier-A may shape generation. Verifier-B may only observe the sealed result.</text>
  <line x1="52" y1="128" x2="1148" y2="128" stroke="#d8dee8"/>
  <text x="62" y="155" class="col">FROZEN DATA</text><text x="325" y="155" class="col">FITTED ARTIFACTS</text><text x="650" y="155" class="col">GENERATION PRIVILEGE</text><text x="950" y="155" class="col">OUTCOME EVALUATION</text>

  <rect x="42" y="175" width="1108" height="166" rx="14" fill="#f7fbfd"/>
  <text x="62" y="202" class="lane-label" fill="#2f6f8f">IN-LOOP LANE · R1 ONLY</text>
  <rect x="62" y="220" width="205" height="92" class="node blue-node"/><text x="82" y="249" class="node-title">R1</text><text x="82" y="274" class="body">2,162 total reviews</text><text x="82" y="296" class="small">dev-200 remains inside R1</text>
  <rect x="325" y="202" width="230" height="58" class="node blue-node"/><text x="345" y="228" class="node-title">R1 retrieval index</text><text x="345" y="248" class="small">886 Region-A examples</text>
  <rect x="325" y="272" width="230" height="58" class="node blue-node"/><text x="345" y="298" class="node-title">Verifier-A</text><text x="345" y="318" class="small">LaBSE probe · train n=804</text>
  <rect x="650" y="220" width="230" height="92" class="node blue-node"/><text x="670" y="249" class="node-title">Generation system</text><text x="670" y="274" class="body">retrieve · gate · select · retry</text><text x="670" y="296" class="small">Researcher · Writer · Critic · Reflector</text>
  <path d="M267 250H325" class="blue-flow"/><path d="M267 282C294 282 298 301 325 301" class="blue-flow"/><path d="M555 231H610Q625 231 625 246V251Q625 266 650 266" class="blue-flow"/><path d="M555 301H650" class="blue-flow"/>

  <rect x="42" y="360" width="1108" height="150" rx="14" fill="#fffaf5"/>
  <text x="62" y="387" class="lane-label" fill="#bd6427">OUTCOME LANE · R2 ONLY</text>
  <rect x="62" y="405" width="205" height="78" class="node orange-node"/><text x="82" y="434" class="node-title">R2</text><text x="82" y="459" class="body">2,163 disjoint reviews</text>
  <rect x="325" y="405" width="230" height="78" class="node orange-node"/><text x="345" y="434" class="node-title">Verifier-B</text><text x="345" y="459" class="body">BanglaBERT · train n=888</text>
  <rect x="950" y="405" width="180" height="78" class="node orange-node"/><text x="970" y="434" class="node-title">Outcome score</text><text x="970" y="459" class="body">sealed outputs only</text>
  <path d="M267 444H325" class="orange-flow"/><path d="M555 444H950" class="orange-flow"/><path d="M765 312V352Q765 370 785 370H920Q940 370 940 390V430Q940 444 950 444" class="gray-flow"/><text x="790" y="351" class="small">emit final response</text>

  <rect x="900" y="176" width="18" height="334" rx="9" fill="#f3d3d0"/><line x1="909" y1="188" x2="909" y2="497" stroke="#b42318" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="932" y="196" class="lane-label" fill="#b42318">PRIVILEGE WALL</text><text x="932" y="217" class="small">B cannot retrieve, prompt, gate,</text><text x="932" y="236" class="small">select, regenerate or stop a draft</text>

  <rect x="42" y="530" width="1108" height="84" rx="12" fill="#f8fafc" stroke="#d8dee8"/>
  <rect x="62" y="543" width="205" height="58" class="node neutral-node"/><text x="82" y="567" class="node-title">Gold-300</text><text x="82" y="588" class="small">Attempt 1 human ratings</text>
  <line x1="290" y1="544" x2="290" y2="600" stroke="#d8dee8"/><text x="315" y="561" class="body">300 reviews · 598/600 ratings · ordinal α = 0.497 → instrument failed</text><text x="315" y="586" class="small">Gate 2 not run; never used for training, retrieval, prompts or tuning. Attempt 2 used fresh non-Gold items.</text>
</svg>
